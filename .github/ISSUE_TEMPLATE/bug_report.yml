name: Bug report
description: Report a reproducible problem in the local gateway, WebUI, MCP adapter, or desktop client.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove private keys, tokens, hostnames, IP addresses, domains, logs, and production data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest safe reproduction using demo or redacted data.
      placeholder: |
        1. Start the local gateway...
        2. Open...
        3. Call...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 arm64, Node 24.x, Codex or Claude Code
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove all secrets and identifying production data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed private keys, tokens, passwords, production addresses, and sensitive output.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
